server:
  port: 9090

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Must match the "iss" value inside the JWT
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/RailBook}

          # Allows Docker Gateway to actually reach Keycloak
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/RailBook/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # =========================
            # USER SERVICE
            # =========================
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/user-service

                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, INTERNAL_SERVER_ERROR
                    methods: GET, POST
                    exceptions:
                      - java.net.ConnectException
                      - io.netty.channel.AbstractChannel$AnnotatedConnectException
                      - java.io.IOException

            # =========================
            # TRAIN SERVICE
            # =========================
            - id: train-service
              uri: lb://TRAIN-SERVICE
              predicates:
                - Path=/api/trains/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: trainServiceCircuitBreaker
                    fallbackUri: forward:/fallback/train-service

                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, INTERNAL_SERVER_ERROR
                    methods: GET, POST
                    exceptions:
                      - java.net.ConnectException
                      - io.netty.channel.AbstractChannel$AnnotatedConnectException
                      - java.io.IOException

            # =========================
            # BOOKING SERVICE
            # =========================
            - id: booking-service
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/api/bookings/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: bookingServiceCircuitBreaker
                    fallbackUri: forward:/fallback/booking-service

                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, INTERNAL_SERVER_ERROR
                    methods: GET, POST
                    exceptions:
                      - java.net.ConnectException
                      - io.netty.channel.AbstractChannel$AnnotatedConnectException
                      - java.io.IOException


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway


resilience4j:

  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

  circuitbreaker:
    instances:

      trainServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

      userServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

      bookingServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true


logging:
  level:
    org.springframework.cloud.gateway: TRACE


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
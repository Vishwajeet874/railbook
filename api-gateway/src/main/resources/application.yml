server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
            - id: train-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/trains/**
            - id: booking-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/bookings/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

services:

  mysql:
    image: mysql:8.0
    container_name: railbook-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root@123"
    ports:
      - "3307:3306"
    volumes:
      - railbook-mysql-data:/var/lib/mysql
    networks:
      - railbook-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot@123"]
      interval: 10s
      timeout: 5s
      retries: 10


  kafka:
    image: apache/kafka:4.1.0
    container_name: railbook-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://railbook-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@railbook-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - railbook-network


  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    image: railbook-booking-service:1.0
    container_name: railbook-booking
    ports:
      - "8083:8083"
    environment:
      DB_URL: "jdbc:mysql://railbook-mysql:3306/railbook_booking"
      DB_USERNAME: root
      DB_PASSWORD: "root@123"

      KAFKA_BOOTSTRAP_SERVERS: "railbook-kafka:9092"

      EUREKA_URL: "http://service-registry:8761/eureka/"

      KEYCLOAK_ISSUER: "http://localhost:8080/realms/RailBook"
      KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/RailBook/protocol/openid-connect/certs"

      TRAIN_SERVICE_URL: "http://train-service:8082"
      USER_SERVICE_URL: "http://user-service:8081"

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy

    networks:
      - railbook-network


  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    image: railbook-payment-service:1.0
    container_name: railbook-payment
    ports:
      - "8085:8085"
    environment:
      DB_URL: "jdbc:mysql://railbook-mysql:3306/railbook_payment"
      DB_USERNAME: root
      DB_PASSWORD: "root@123"

      KAFKA_BOOTSTRAP_SERVERS: "railbook-kafka:9092"

      EUREKA_URL: "http://service-registry:8761/eureka/"

      PAYMENT_SIMULATION_RESULT: "SUCCESS"

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_healthy

    networks:
      - railbook-network


  train-service:
    build:
      context: ./services/train-service
      dockerfile: Dockerfile
    image: railbook-train-service:1.0
    container_name: railbook-train
    ports:
      - "8082:8082"

    environment:
      DB_URL: "jdbc:mysql://railbook-mysql:3306/railbook_train_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: "root@123"

      EUREKA_URL: "http://service-registry:8761/eureka/"

    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy

    networks:
      - railbook-network



  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile

    image: railbook-user-service:1.0
    container_name: railbook-user

    ports:
      - "8081:8081"

    environment:
      DB_URL: "jdbc:mysql://railbook-mysql:3306/railbook_user_db"
      DB_USERNAME: root
      DB_PASSWORD: "root@123"

      KEYCLOAK_ISSUER: "http://localhost:8080/realms/RailBook"
      KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/RailBook/protocol/openid-connect/certs"
      KEYCLOAK_SERVER_URL: "http://keycloak:8080"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      EUREKA_URL: "http://service-registry:8761/eureka/"

    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy

    networks:
      - railbook-network


  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
    image: railbook-service-registry:1.0
    container_name: railbook-service-registry
    ports:
      - "8761:8761"
    networks:
      - railbook-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    image: railbook-api-gateway:1.0
    container_name: railbook-api-gateway

    ports:
      - "9090:9090"

    environment:
      EUREKA_URL: "http://service-registry:8761/eureka/"
      KEYCLOAK_ISSUER: "http://localhost:8080/realms/RailBook"
      KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/RailBook/protocol/openid-connect/certs"

    depends_on:
      service-registry:
        condition: service_healthy

    networks:
      - railbook-network

volumes:
  railbook-mysql-data:
    external: true
    name: railbook-mysql-data


networks:
  railbook-network:
    external: true
    name: railbook-network
spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/railbook_user_db
    username: root
    password: root@123

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/RailBook
server:
  port: 8081

# Keycloak Admin Client Configuration
keycloak:
  server-url: http://localhost:8080
  realm: RailBook
  client-id: railbook-user-service
  client-secret: mIxhI2foL3OE2ojHW21JKwHI8rscuf1deergijl7cwCofmeOdSLF5vZUvNriMig8INAcjB98wWG8PQvUI8MdB9

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    non-secure-port: ${server.port}
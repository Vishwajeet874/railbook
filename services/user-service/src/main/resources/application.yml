spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/railbook_user_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root@123}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/RailBook}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/RailBook/protocol/openid-connect/certs}


server:
  port: 8081


keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: RailBook
  client-id: railbook-user-service
  client-secret: ${KEYCLOAK_CLIENT_SECRET}


management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true